# Provider 独立主机 Compose。Provider Redis 由同角色的共享 Redis 发布步骤管理，
# 本文件刻意不定义 Analytics、Analytics MySQL 或 Analytics Redis。
services:
  academic-provider:
    image: ${CAMPUS_ACADEMIC_PROVIDER_IMAGE:?set CAMPUS_ACADEMIC_PROVIDER_IMAGE}
    command: ["/app/academic-provider"]
    ports:
      - "${CAMPUS_ACADEMIC_PROVIDER_BIND_ADDRESS:-0.0.0.0}:${CAMPUS_ACADEMIC_PROVIDER_PUBLISHED_PORT:-9090}:9090"
      - "${CAMPUS_ACADEMIC_PROVIDER_METRICS_BIND_ADDRESS:-127.0.0.1}:${CAMPUS_ACADEMIC_PROVIDER_METRICS_PUBLISHED_PORT:-9300}:9300"
    environment:
      CAMPUS_ACADEMIC_BOOTSTRAP_FILE: /etc/campus-academic/bootstrap.yaml
      CAMPUS_BOOTSTRAP_FILE: /etc/campus-academic/bootstrap.yaml
      CAMPUS_ACADEMIC_PROVIDER_LISTEN: ":9090"
      CAMPUS_ACADEMIC_METRICS_ADDRESS: ":9300"
      CAMPUS_ACADEMIC_PROVIDER_DIAGNOSTIC_HTML_DIR: /var/lib/campus-academic/diagnostics
      CAMPUS_ACADEMIC_PROVIDER_REDIS_ADDRESS: ${CAMPUS_ACADEMIC_PROVIDER_REDIS_ADDRESS:?set shared Provider Redis address}
      CAMPUS_ACADEMIC_PROVIDER_REDIS_USERNAME: ${CAMPUS_ACADEMIC_PROVIDER_REDIS_USERNAME:-default}
      CAMPUS_ACADEMIC_PROVIDER_REDIS_PASSWORD: ${CAMPUS_ACADEMIC_PROVIDER_REDIS_PASSWORD:?set Provider Redis password}
      CAMPUS_ACADEMIC_PROVIDER_REDIS_DB: ${CAMPUS_ACADEMIC_PROVIDER_REDIS_DB:-0}
      CAMPUS_ACADEMIC_PROVIDER_REDIS_TLS: "true"
      CAMPUS_ACADEMIC_PROVIDER_REDIS_TLS_FILES_ROOT: /run/secrets/provider-redis
      CAMPUS_ACADEMIC_PROVIDER_REDIS_CA_FILE: ${CAMPUS_ACADEMIC_PROVIDER_REDIS_CA_FILE:?set Provider Redis CA file}
      CAMPUS_ACADEMIC_PROVIDER_REDIS_CLIENT_CERT_FILE: ${CAMPUS_ACADEMIC_PROVIDER_REDIS_CLIENT_CERT_FILE:-}
      CAMPUS_ACADEMIC_PROVIDER_REDIS_CLIENT_KEY_FILE: ${CAMPUS_ACADEMIC_PROVIDER_REDIS_CLIENT_KEY_FILE:-}
      CAMPUS_ACADEMIC_PROVIDER_REDIS_SERVER_NAME: ${CAMPUS_ACADEMIC_PROVIDER_REDIS_SERVER_NAME:?set Provider Redis server name}
      CAMPUS_ACADEMIC_PROVIDER_KEY: ${CAMPUS_ACADEMIC_PROVIDER_KEY:?set provider key}
      CAMPUS_ACADEMIC_QUERY_KEY: ${CAMPUS_ACADEMIC_QUERY_KEY:?set query key}
    volumes:
      - ${CAMPUS_ACADEMIC_BOOTSTRAP_HOST_FILE:?set CAMPUS_ACADEMIC_BOOTSTRAP_HOST_FILE}:/etc/campus-academic/bootstrap.yaml:ro
      - ${CAMPUS_ACADEMIC_PROVIDER_CONFIG_HOST_FILE:?set CAMPUS_ACADEMIC_PROVIDER_CONFIG_HOST_FILE}:/app/provider-config.yaml:ro
      - ${CAMPUS_ACADEMIC_RPC_TLS_HOST_DIR:?set CAMPUS_ACADEMIC_RPC_TLS_HOST_DIR}:/run/secrets/academic-rpc:ro
      - ${CAMPUS_ACADEMIC_PROVIDER_REDIS_TLS_HOST_DIR:?set CAMPUS_ACADEMIC_PROVIDER_REDIS_TLS_HOST_DIR}:/run/secrets/provider-redis:ro
      - ${CAMPUS_ACADEMIC_DIAGNOSTIC_HTML_HOST_DIR:-/var/lib/campus-academic/diagnostics}:/var/lib/campus-academic/diagnostics
    healthcheck:
      test: ["CMD", "/app/academic-provider", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
