services:
  provider-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - provider-redis:/data

  analytics-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - analytics-redis:/data

  analytics-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_academic
      MYSQL_USER: campus_academic
      MYSQL_PASSWORD: ${CAMPUS_ACADEMIC_DB_PASSWORD:?set CAMPUS_ACADEMIC_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CAMPUS_ACADEMIC_DB_ROOT_PASSWORD:?set CAMPUS_ACADEMIC_DB_ROOT_PASSWORD}
    volumes:
      - analytics-mysql:/var/lib/mysql

  academic-provider:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/academic-provider"]
    depends_on:
      provider-redis:
        condition: service_started
    environment:
      CAMPUS_ACADEMIC_BOOTSTRAP_FILE: /etc/campus-academic/bootstrap.yaml
      CAMPUS_ACADEMIC_PROVIDER_REDIS_ADDRESS: provider-redis:6379
      CAMPUS_ACADEMIC_PROVIDER_KEY: ${CAMPUS_ACADEMIC_PROVIDER_KEY:?set provider key}
      CAMPUS_ACADEMIC_QUERY_KEY: ${CAMPUS_ACADEMIC_QUERY_KEY:?set query key}
    volumes:
      - ../bootstrap.yaml:/etc/campus-academic/bootstrap.yaml:ro
      - ../provider-config.yaml:/app/provider-config.yaml:ro

  academic-analytics:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/academic-analytics"]
    depends_on:
      analytics-migrate:
        condition: service_completed_successfully
      analytics-mysql:
        condition: service_started
      analytics-redis:
        condition: service_started
    environment:
      CAMPUS_ACADEMIC_BOOTSTRAP_FILE: /etc/campus-academic/bootstrap.yaml
      CAMPUS_ACADEMIC_ANALYTICS_DSN: campus_academic:${CAMPUS_ACADEMIC_DB_PASSWORD}@tcp(analytics-mysql:3306)/campus_academic?parseTime=true
      CAMPUS_ACADEMIC_ANALYTICS_SOURCE_DSN: ${CAMPUS_ACADEMIC_ANALYTICS_SOURCE_DSN:?set read-only source DSN}
      CAMPUS_ACADEMIC_ANALYTICS_REDIS_ADDRESS: analytics-redis:6379
    volumes:
      - ../bootstrap.yaml:/etc/campus-academic/bootstrap.yaml:ro

  analytics-migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/academicctl", "migrate", "up"]
    depends_on:
      analytics-mysql:
        condition: service_started
    environment:
      CAMPUS_ACADEMIC_MIGRATION_URL: mysql://campus_academic:${CAMPUS_ACADEMIC_DB_PASSWORD}@tcp(analytics-mysql:3306)/campus_academic?multiStatements=true

volumes:
  provider-redis:
  analytics-redis:
  analytics-mysql:
